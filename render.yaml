# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render click
# "New +" -> "Blueprint" and select the repo. Render reads this file.
#
# FREE PLAN NOTES:
#   - No persistent disk: the SQLite file lives on the container's ephemeral
#     filesystem and resets on every deploy/restart. The app re-scrapes on
#     startup, so a fresh visit after a restart still shows current jobs.
#   - The service sleeps after ~15 min of inactivity. While asleep the 09:00
#     scheduler does not run; the on-startup scrape refreshes data on wake.
services:
  - type: web
    name: leadership-jobs-digest
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Run the daily scheduler in the app's local time (adjust as needed).
      - key: TZ
        value: UTC
